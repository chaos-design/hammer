name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails if any package points at entry files that were never built, or if
      # two packages declare the same name.
      - name: Verify publishable packages
        run: node scripts/verify-publishable.mjs

      # Fails on phantom dependencies (imports that only resolve because of a
      # hoisted node_modules) and on React being declared as a dependency.
      - name: Verify peer dependencies
        run: node scripts/verify-peers.mjs