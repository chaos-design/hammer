name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'packages/shadcn-ui/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @chaos-design/hammer-docs run build
        env:
          DEPLOY_TARGET: github
          # GitHub Pages serves a project site from /<repo>/; Next needs it to
          # prefix every emitted asset and route.
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify export
        run: |
          test -f apps/docs/out/index.html \
            || { echo "::error::docs export missing index.html"; exit 1; }
          # Assets must carry the repository prefix or every request 404s.
          grep -q '"/hammer/_next/' apps/docs/out/index.html \
            || { echo "::error::export is missing the /hammer/ basePath"; exit 1; }
          echo "docs export looks correct"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4