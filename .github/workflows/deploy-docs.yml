name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'packages/shadcn-ui/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the `pnpm@x.y.z` version from the `packageManager` field in
      # package.json, so the toolchain is pinned in exactly one place.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @chaos-design/hammer-docs run build
        env:
          DEPLOY_TARGET: github
          # GitHub Pages serves a project site from /<repo>/; Next needs it to
          # prefix every emitted asset and route.
          GITHUB_REPOSITORY: ${{ github.repository }}
          # This deployment is a mirror of the canonical domain, so `og:image`,
          # canonicals and share links point at the primary host.
          SITE_URL: https://hammer.chaosmic.cn

      - name: Verify export
        run: |
          test -f apps/docs/out/index.html \
            || { echo "::error::docs export missing index.html"; exit 1; }
          # Assets must carry the repository prefix, or every request 404s.
          grep -q '"/hammer/_next/' apps/docs/out/index.html \
            || { echo "::error::export is missing the /hammer/ basePath"; exit 1; }
          # Metadata must never point at the dev server, or shared links have no
          # preview. Match the tag's content attribute, not a bare string —
          # prose (the changelog documents this very bug) would false-positive.
          # Assert on the shape, not on a host: the origin comes from SITE_URL
          # and moves when the domain changes.
          ! grep -qE 'content="https?://localhost' apps/docs/out/index.html \
            || { echo "::error::metadata still points at localhost"; exit 1; }
          # Docs pages carry a generated OG image; it must be absolute https.
          page=apps/docs/out/docs/guides/installation/index.html
          test -f "$page" || { echo "::error::missing $page"; exit 1; }
          grep -qE 'og:image" content="https://[^"]+/og/docs/' "$page" \
            || { echo "::error::og:image is not an absolute https URL"; exit 1; }
          test -f apps/docs/out/og/docs/guides/installation/image.png \
            || { echo "::error::og:image target was not exported"; exit 1; }
          echo "docs export looks correct"

      - name: Verify bilingual export
        run: node scripts/verify-docs-export.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4