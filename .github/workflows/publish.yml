name: Publish

# Publishing is irreversible, so it is gated on an explicit tag or a manual
# dispatch. Triggering on every push to `main` would attempt a publish per
# commit and fail the run whenever the registry rejects it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to publish (default: all)'
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Fail fast, and with an actionable message, when the token is missing or
      # the scope has never been published — otherwise the first publish dies
      # with a bare `404` on PUT.
      - name: Check registry credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN is not set"
            exit 1
          fi
          who=$(npm whoami --registry=https://registry.npmjs.org 2>/dev/null) \
            || { echo "::error::NPM_TOKEN is invalid or expired"; exit 1; }
          echo "authenticated as $who"
          # Publishing a package under a scope that has never been published
          # requires that scope to exist, otherwise the PUT returns 404.
          if ! npm view @chaos-design --registry=https://registry.npmjs.org \
               >/dev/null 2>&1; then
            echo "::warning::no @chaos-design package is visible on the registry yet;"
            echo "::warning::the scope must exist before a first publish can succeed."
          fi

      # Verifies that every package points at entry files that exist, that dependency
      # versions are not already on the registry, and that packages are
      # published in dependency order.
      - name: Publish packages
        run: pnpm run publish-pkg ${{ inputs.packages }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}