name: Publish

# Publishing is irreversible, so it is gated on an explicit tag or a manual
# dispatch. Triggering on every push to `main` would attempt a publish per
# commit and fail the run whenever the registry rejects it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to publish (default: all)'
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the `pnpm@x.y.z` version from the `packageManager` field in
      # package.json, so the toolchain is pinned in exactly one place.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Fail fast, and with an actionable message, when the token is missing or
      # invalid — otherwise the first publish dies with a bare `404` on PUT.
      - name: Check registry credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN is not set"
            exit 1
          fi
          who=$(npm whoami --registry=https://registry.npmjs.org 2>/dev/null) \
            || { echo "::error::NPM_TOKEN is invalid or expired"; exit 1; }
          echo "authenticated as $who"
          # A first publish under an org scope is rejected unless that org exists
          # on the registry. `npm view @chaos-design` cannot detect this — it
          # errors for every scope, published or not — so the org endpoint is
          # queried instead.
          if ! curl -fsS 'https://registry.npmjs.org/-/org/chaos-design/package?format=cli' >/dev/null; then
            echo "::warning::the chaos-design org is not visible on the registry yet;"
            echo "::warning::it must exist before a first publish can succeed."
          fi

      # Verifies that every package points at entry files that exist, that dependency
      # versions are not already on the registry, and that packages are
      # published in dependency order.
      #
      # Both inputs arrive through the environment rather than being interpolated
      # into the script, so a value typed into the dispatch form cannot inject
      # shell syntax.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          # Unquoted on purpose: the dispatch input is a space-separated list and
          # has to be split into separate arguments.
          expect=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            expect="--expect-version=${GITHUB_REF_NAME#v}"
          fi
          pnpm run publish-pkg $INPUT_PACKAGES $expect
