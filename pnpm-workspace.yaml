packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/config/*'
  - 'packages/config/tsconfig/*'
  - 'packages/utils/*'
  - 'packages/run/*'
  - 'packages/npm/*'
  - 'packages/babel-plugin/*'
  - 'packages/shadcn-ui/*'

# pnpm >= 10 refuses to run dependency lifecycle scripts unless they are
# allowlisted here, and skips them with a warning. Every package below has a
# build script in the dependency tree, so dropping any of them leaves a broken
# install in CI.
#   esbuild           - platform binary required by the vite/rollup builds
#   msw               - auto-installed peer of vitest / shadcn
#   sharp             - Next.js production image optimisation
#   simple-git-hooks  - installs the pre-commit hook
#
# The key is `onlyBuiltDependencies`. pnpm 12 renamed it to `allowBuilds`, but
# pnpm 12 cannot be installed on Vercel (see `packageManager` in package.json),
# and pnpm 10 ignores the newer name without warning.
onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - simple-git-hooks

# pnpm >= 10 no longer reads pnpm-specific settings from `.npmrc` — it silently
# ignores them. The settings below used to live in `.npmrc` and are reproduced
# here so the upgrade does not change how dependencies resolve.
#   nodeLinker             - 'hoisted' keeps a flat node_modules, as before.
#                            Switching to pnpm's 'isolated' default would stop
#                            undeclared packages from resolving by accident, but
#                            it is a separate migration with its own fallout.
#   autoInstallPeers       - do not auto-install missing peer dependencies
#   strictPeerDependencies - do not fail the install on peer version mismatches
nodeLinker: hoisted
autoInstallPeers: false
strictPeerDependencies: false
